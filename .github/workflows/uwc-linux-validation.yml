name: UWC Linux Validation

on:
  push:
    branches:
      - chore/uwc-linux-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Full pytest suite
        run: python -m pytest

      - name: Focused Work Capture suite
        run: python -m pytest tests/work_capture

      - name: Strict mypy
        run: python -m mypy

      - name: Ruff
        run: python -m ruff check .

      - name: Validate JSON configuration files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path('config').glob('*.json'))
          if not files:
              raise SystemExit('No config JSON files found')
          for path in files:
              with path.open('r', encoding='utf-8') as handle:
                  json.load(handle)
              print(f'PASS {path}')
          print(f'Validated {len(files)} JSON files')
          PY

      - name: Verify frozen activation manifest SHA-256
        run: sha256sum --check config/work-capture-v1-activation-manifest.sha256

      - name: Verify frozen Power Apps source hashes
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          baseline_path = Path('config/work-capture-power-app-baseline.json')
          baseline = json.loads(baseline_path.read_text(encoding='utf-8'))
          root = Path(baseline['source_control']['root'])
          expected = baseline['source_control']['files']
          if not expected:
              raise SystemExit('No Power Apps source hashes recorded')
          for name, expected_hash in expected.items():
              path = root / name
              actual_hash = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual_hash != expected_hash:
                  raise SystemExit(f'Hash mismatch for {path}: {actual_hash} != {expected_hash}')
              print(f'PASS {path} {actual_hash}')
          PY

      - name: Git diff check
        run: git diff --check HEAD^

      - name: Git status
        run: |
          git status --short
          test -z "$(git status --porcelain)"
