name: EDN OS PR checks

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edn-pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux synthetic validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Record versions
        run: python -m pip freeze
      - name: Frozen artifact and configuration integrity
        run: python tools/ci/check_integrity.py
      - name: Full synthetic suite
        run: python -m pytest -q --junitxml=${{ runner.temp }}/pytest-linux.xml
      - name: Ruff
        if: ${{ !cancelled() }}
        run: python -m ruff check .
      - name: Strict native Linux mypy
        if: ${{ !cancelled() }}
        run: python -m mypy
      - name: Whitespace across PR range
        if: ${{ !cancelled() }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            git diff --check "$PR_BASE_SHA" HEAD
          else
            git diff --check HEAD^ HEAD
          fi
      - name: No test-created tracked or untracked artifacts
        if: ${{ !cancelled() }}
        run: test -z "$(git status --porcelain)"

  windows:
    name: Windows baseline regression guard
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Record versions
        run: python -m pip freeze
      - name: Frozen artifact and configuration integrity
        run: python tools/ci/check_integrity.py
      - name: Run suite and check known failure signatures
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'pytest-windows.xml'
          python -m pytest -q "--junitxml=$report"
          $testExit = $LASTEXITCODE
          if ($testExit -notin @(0, 1)) { exit $testExit }
          python tools/ci/check_windows_baseline.py $report
          exit $LASTEXITCODE
